name: Himeko Cognitive OS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Debug repository structure
        run: |
          pwd
          echo "=== ROOT ==="
          ls -la
          echo "=== CORE ==="
          ls -la core
          echo "=== GIT FILES ==="
          git ls-files core
          echo "=== PYTHON PATH ==="
          python -c "import sys; print('\n'.join(sys.path))"
          echo "=== IMPORT TEST ==="
          python -c "import core; print(core.__file__)"
          python -c "import core.gestalt_engine; print(core.gestalt_engine.__file__)"
      - name: Run Tests
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE python -m unittest discover -s tests -p "test_*.py"
